<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Inline script to prevent theme flash:
			// Auto detect system dark setting; default to light theme on failure or absence
			try {
				const saved = localStorage.getItem('lanflare_theme');
				let isDark = false;
				if (saved === 'dark') {
					isDark = true;
				} else if (saved === 'light') {
					isDark = false;
				} else {
					// system detection
					if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
						isDark = true;
					} else {
						isDark = false;
					}
				}
				if (isDark) {
					document.documentElement.classList.add('dark');
					document.documentElement.style.colorScheme = 'dark';
				} else {
					document.documentElement.classList.remove('dark');
					document.documentElement.style.colorScheme = 'light';
				}
			} catch (_) {
				// On any detection error, fallback to light theme
				document.documentElement.classList.remove('dark');
				document.documentElement.style.colorScheme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 select-none antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
