<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<script>
			// Inline script to prevent theme flash and apply safe area insets:
			try {
				const saved = localStorage.getItem('lanflare_theme');
				let isDark = false;
				if (saved === 'dark') {
					isDark = true;
				} else if (saved === 'light') {
					isDark = false;
				} else {
					// system detection
					if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
						isDark = true;
					} else {
						isDark = false;
					}
				}
				if (isDark) {
					document.documentElement.classList.add('dark');
					document.documentElement.style.colorScheme = 'dark';
				} else {
					document.documentElement.classList.remove('dark');
					document.documentElement.style.colorScheme = 'light';
				}
			} catch (_) {
				// On any detection error, fallback to light theme
				document.documentElement.classList.remove('dark');
				document.documentElement.style.colorScheme = 'light';
			}

			// Synchronously query Android safe insets if injected early by native webview
			try {
				if (window.AndroidSafeInsets) {
					const top = window.AndroidSafeInsets.getTop();
					const bottom = window.AndroidSafeInsets.getBottom();
					const left = window.AndroidSafeInsets.getLeft();
					const right = window.AndroidSafeInsets.getRight();
					if (typeof top === 'number' && top > 0) document.documentElement.style.setProperty('--safe-area-inset-top', top + 'px');
					if (typeof bottom === 'number' && bottom > 0) document.documentElement.style.setProperty('--safe-area-inset-bottom', bottom + 'px');
					if (typeof left === 'number' && left > 0) document.documentElement.style.setProperty('--safe-area-inset-left', left + 'px');
					if (typeof right === 'number' && right > 0) document.documentElement.style.setProperty('--safe-area-inset-right', right + 'px');
				}
			} catch (_) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 select-none antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
