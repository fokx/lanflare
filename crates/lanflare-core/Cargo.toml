[package]
name = "lanflare-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "High-performance LocalSend v2.2 core transfer engine with hybrid discovery, TLS, and streaming I/O"
keywords = ["localsend", "network", "file-transfer", "p2p", "lan"]
categories = ["network-programming", "asynchronous"]

[dependencies]
lanflare-proto = { path = "../lanflare-proto", version = "0.4.0" }


# Async runtime & IO
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }

# Networking & HTTP
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
reqwest = { workspace = true }
socket2 = { workspace = true }
if-addrs = { workspace = true }

# Crypto & TLS
rcgen = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }
rsa = { workspace = true }
pem = { workspace = true }
x509-parser = { workspace = true }
rand = { workspace = true }
base64 = "0.22"

# Error & Logging
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Data & Serialisation
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
mdns-sd = { workspace = true }
zip = { workspace = true }

[[bench]]
name = "transfer_benchmark"
harness = false
