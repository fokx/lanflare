[package]
name = "lanflare-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "lanflare_desktop"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "lanflare-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
lanflare-proto = { path = "../lanflare-proto", version = "0.3.0" }
lanflare-core = { path = "../lanflare-core", version = "0.3.0" }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }

# Tauri v2
tauri = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-fs = { workspace = true }
tauri-plugin-opener = { workspace = true }
tauri-plugin-shell = { workspace = true }
tauri-plugin-clipboard-manager = "2.5.0"
png = "0.18.1"
url = "2.5"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.6.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-mobile-sharetarget = "2.0.0"

